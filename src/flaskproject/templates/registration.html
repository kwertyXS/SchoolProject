<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <style>
        /* Те же стили, что и на странице входа */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 350px;
        }

        .card h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745; /* Зеленый цвет для регистрации (отличие) */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #218838;
        }

        /* Дополнительный стиль для ссылки внизу */
        .switch-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .switch-link a {
            color: #007bff;
            text-decoration: none;
        }

        .switch-link a:hover {
            text-decoration: underline;
        }

        .form-message { display: none; margin-top: 15px; padding: 10px; border-radius: 5px; font-size: 14px; text-align: center; }
        .form-message.success { display: block; background: #e6f4ea; color: #1e7e34; border: 1px solid #b7dfc2; }
        .form-message.error { display: block; background: #fdecea; color: #c82333; border: 1px solid #f5c2c7; }
        button:disabled { opacity: .6; cursor: default; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Регистрация</h2>
        <form action="/api/register" method="post" id="registerForm">
            <!-- Поле Имя -->
            <div class="form-group">
                <label for="fullname">Ваше имя</label>
                <input type="text" id="fullname" name="fullname" placeholder="Иван Иванов" required>
            </div>

            <!-- Поле Email -->
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="example@mail.ru" required>
            </div>

            <!-- Поле Пароль -->
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Придумайте пароль" required>
            </div>

            <!-- Поле Повтор пароля -->
            <div class="form-group">
                <label for="confirm_password">Повторите пароль</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Повторите пароль" required>
            </div>

            <button type="submit">Зарегистрироваться</button>
        </form>
        <div class="form-message" id="formMessage"></div>

        <!-- Ссылка на вход -->
        <div class="switch-link">
            Уже есть аккаунт? <a href="/login">Войти</a>
        </div>
    </div>

</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.js" integrity="sha512-+k1pnlgt4F1H8L7t3z95o3/KO+o78INEcXTbnoJQ/F2VqDVhWoaiVml/OEHv9HsVgxUaVW+IbiZPUJQfF/YxZw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
(function () {
    var form = document.getElementById('registerForm');
    var box = document.getElementById('formMessage');
    function show(type, text) { box.className = 'form-message ' + type; box.textContent = text; }
    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        var data = Object.fromEntries(new FormData(form).entries());
        if (data.password !== data.confirm_password) { show('error', 'Пароли не совпадают'); return; }
        var btn = form.querySelector('button[type="submit"]');
        btn.disabled = true;
        show('success', 'Отправка…');
        try {
            var res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify(data)
            });
            var body = {};
            try { body = await res.json(); } catch (_) {}
            if (res.ok && body.success !== false) {
                show('success', body.message || 'Регистрация прошла успешно');
                setTimeout(function () { window.location.href = body.redirect || '/login'; }, 1200);
            } else {
                show('error', body.message || body.error || 'Ошибка ' + res.status);
            }
        } catch (err) {
            show('error', 'Сервер недоступен. Попробуйте позже.');
        } finally {
            btn.disabled = false;
        }
    });
})();
</script>
</html>
