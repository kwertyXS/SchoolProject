[project]
name = "flaskproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maksim Sikk Eduardovitch", email = "kwertyXS@gmail.com" }
]
requires-python = ">=3.8"
dependencies = [
    "flask>=3.0.3",
    "jwt>=1.3.1",
    "mysql-connector-python>=9.0.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.4",
]

[project.scripts]
flaskproject = "flaskproject:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"
